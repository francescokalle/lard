# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0

# Emoji & symbol fallback (color emoji via Noto Color Emoji, Nerd Font glyphs from JBM NF)
symbol_map U+1F300-U+1FAFF,U+2600-U+27BF,U+FE0F Noto Color Emoji
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD JetBrainsMono Nerd Font

# Disable ligatures only on cursor (optional, comment out if you want full ligatures)
disable_ligatures cursor

# Window Configuration
window_padding_width 12
background_opacity 0.5
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include lard-theme.conf
# include dank-theme.conf
