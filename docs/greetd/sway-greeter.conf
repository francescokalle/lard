# /etc/lard/greeter-sway.conf
#
# Sway kiosk minimale che ospita il greeter. Importante: quando il greeter esce
# (dopo greetd.start_session) anche sway deve uscire, altrimenti greetd resta in
# attesa del processo compositore.
output * bg #070A12 solid_color
exec "lard greeter; swaymsg exit"

# Nessuna barra, nessuna bind di sistema.
default_border none
font pango:Inter 10
