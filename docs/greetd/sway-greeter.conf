# /etc/lard/greeter-sway.conf
#
# Minimal kiosk Sway that hosts the greeter. Important: when the greeter exits
# (after greetd.start_session) sway must exit too, otherwise greetd keeps waiting
# for the compositor process.
output * bg #070A12 solid_color
exec "lard greeter; swaymsg exit"

# No bar, no system binds.
default_border none
font pango:Inter 10
