# /etc/greetd/config.toml
#
# greetd owns the privilege boundary: PAM, permissions, session registration.
# lard greeter is an unprivileged Wayland client and only speaks greetd's JSON
# protocol.
#
# A Wayland client cannot host itself: a host compositor with
# zwlr_layer_shell_v1 support is required. niri is used: LARD already requires
# it, it implements layer-shell, and it is the setup verified on the reference
# machine. Sway works too (see docs/greetd/sway-greeter.conf) but is an extra
# dependency and is not packaged on every distribution.

[terminal]
vt = 1
switch = true

[default_session]
command = "niri --config /etc/lard/greeter.kdl"
user = "greeter"
