# /etc/greetd/config.toml
#
# greetd owns the privilege boundary: PAM, permissions, session registration.
# lard greeter is an unprivileged Wayland client and only speaks greetd's JSON
# protocol.
#
# A Wayland client cannot host itself: a host compositor with zwlr_layer_shell_v1
# support is required. Sway (wlroots) is the recommended choice: cage does NOT
# implement wlr-layer-shell and is not suitable for this greeter. Alternatively
# use niri with docs/greeter-niri.kdl.

[terminal]
vt = 1

[default_session]
command = "sway --config /etc/lard/greeter-sway.conf"
user = "greeter"

# Alternative with niri as the host compositor:
# command = "niri --config /etc/lard/greeter.kdl"
# user = "greeter"
